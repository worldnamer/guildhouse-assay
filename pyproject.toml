[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "assay"
version = "0.1.0"
description = "Check whether a job posting is worth applying to, using Jev."
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "requests",
    "pyperclip",
    "platformdirs",
    # Exact: the trained classifier is a pickle, which only loads under the version that saved it.
    "scikit-learn==1.9.1",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
assay = "assay.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
